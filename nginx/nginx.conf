worker_processes 1;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    upstream taxi_app {
        least_conn;
        server app-a:8000 max_fails=3 fail_timeout=5s;
        server app-b:8000 max_fails=3 fail_timeout=5s;
    }

    upstream taxi_ws {
        least_conn;
        server gateway-a:8086 max_fails=3 fail_timeout=5s;
        server gateway-b:8086 max_fails=3 fail_timeout=5s;
    }

    upstream taxi_sim {
        server external-sim:8085;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        location = /v1/ws {
            proxy_pass http://taxi_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /v1/ {
            proxy_pass http://taxi_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        location /health {
            proxy_pass http://taxi_app;
        }

        location /ready {
            proxy_pass http://taxi_app;
        }

        location /sim/ {
            proxy_pass http://taxi_sim/;
            proxy_set_header Host $host;
        }

        location /web/ {
            alias /usr/share/nginx/html/;
            index index.html;
        }

        location = / {
            return 302 /web/;
        }
    }
}
