openapi: 3.1.0
info:
  title: C14 Taxi API
  version: 1.1.0
  description: |
    Passenger rides with atomic driver assignment. All state is in PostgreSQL;
    two app instances sit behind nginx. Tariffs v2 are a feature-flagged change.
  contact:
    name: Team Zhivotchenko, Strilets, Lisoyvan, Kuz
x-course:
  topic: C14
servers:
  - url: http://localhost:8080
    description: nginx (only external entry point)
tags:
  - name: rides
  - name: auth
  - name: staff
  - name: service
  - name: simulator

paths:
  /health:
    get:
      tags: [service]
      summary: Liveness, no database call
      operationId: health
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema: {type: object, properties: {status: {type: string}, instance: {type: string}}}
              examples:
                app_a: {value: {status: ok, instance: app-a}}
                app_b: {value: {status: ok, instance: app-b}}
  /ready:
    get:
      tags: [service]
      summary: Readiness, 503 while draining
      operationId: ready
      responses:
        '200': {description: Ready}
        '503': {$ref: '#/components/responses/Problem'}
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Obtain an opaque token (expires in 1 hour)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
            examples:
              passenger: {value: {login: passenger1, password: pass123}}
              dispatcher: {value: {login: dispatcher, password: pass123}}
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
              examples:
                passenger: {value: {token: opaque-token, token_type: Bearer, expires_at: '2026-11-26T12:00:00Z', user: {id: u-passenger-1, login: passenger1, role: user, district: central}}}
        '401': {$ref: '#/components/responses/Problem'}
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Destroy session and close its WebSockets with 1008
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Logged out}
        '401': {$ref: '#/components/responses/Problem'}
  /v1/me:
    get:
      tags: [auth]
      operationId: me
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
              examples:
                passenger: {value: {id: u-passenger-1, login: passenger1, role: user, district: central}}
                dispatcher: {value: {id: u-dispatcher, login: dispatcher, role: staff, district: central}}
        '401': {$ref: '#/components/responses/Problem'}
  /v1/rides:
    post:
      tags: [rides]
      operationId: createRide
      summary: Order a ride; pick a free driver with FOR UPDATE SKIP LOCKED
      description: Main operation. Idempotency-Key is mandatory; replay returns the saved 201.
      security: [{bearerAuth: []}]
      x-course: main
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RideCreate'}
            examples:
              normal:
                summary: Звичайне замовлення (5 водіїв у central)
                value: {district: central, pickup: вул. Хрещатик, 1, distance_km: 2.5, duration_min: 10}
              scarce:
                summary: Гонка за 5 водіїв — 20 запитів дадуть 201×5 і 409×15
                value: {district: central, pickup: вул. Хрещатик, 1, distance_km: 3, duration_min: 12}
                x-capacity: 5
              missing:
                summary: Району немає — 404
                value: {district: no-such-district, pickup: вул. Хрещатик, 1}
              old_client:
                summary: Pre-tariff client (defaults to standard)
                value: {district: central, pickup: вул. Хрещатик, 1}
              tariffs_v2:
                summary: New client
                value: {district: central, pickup: вул. Хрещатик, 1, tariff: comfort, distance_km: 7.5, duration_min: 18}
      responses:
        '201':
          description: Ride created and driver assigned
          headers:
            Location: {schema: {type: string}, example: /v1/rides/7d6f...}
            ETag: {schema: {type: string}, example: '"1"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ride'}
              examples:
                created: {value: {id: 7d6f, user_id: u-passenger-1, district: central, pickup: вул. Хрещатик, 1, driver_id: d-1, status: assigned, payment_status: unpaid, fare_minor: 3700, currency: UAH, version: 1, tariff: standard, distance_km: '2.50', created_at: '2026-11-26T10:00:00Z', accept_deadline: '2026-11-26T10:02:00Z'}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
    get:
      tags: [rides]
      operationId: listRides
      summary: My rides, newest first, opaque cursor
      security: [{bearerAuth: []}]
      x-course: list
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: cursor
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Page of rides
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Ride'}}
                  next_cursor: {type: [string, 'null']}
                  limit: {type: integer}
        '400': {$ref: '#/components/responses/Problem'}
  /v1/rides/{ride_id}:
    parameters:
      - $ref: '#/components/parameters/RideId'
    get:
      tags: [rides]
      operationId: getRide
      summary: My ride only; foreign or missing ride is 404
      security: [{bearerAuth: []}]
      x-course: object
      responses:
        '200':
          description: Ride
          headers:
            ETag: {schema: {type: string}, example: '"3"'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ride'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [rides]
      operationId: patchRide
      summary: Change pickup with If-Match
      security: [{bearerAuth: []}]
      x-course: update
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RidePatch'}
            examples:
              normal:
                summary: Дозволена зміна адреси
                value: {pickup: вул. Володимирська, 10}
              forbidden:
                summary: Спроба змінити власника/стан/версію — 422
                value: {pickup: вул. Володимирська, 10, user_id: u-passenger-2, status: finished, version: 99}
      responses:
        '200':
          description: Updated ride
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ride'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '412': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '428': {$ref: '#/components/responses/Problem'}
  /v1/rides/{ride_id}/cancel:
    post:
      tags: [rides]
      operationId: cancelRide
      summary: Cancel; a replay never frees the driver twice
      security: [{bearerAuth: []}]
      x-course: cancel
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200': {description: Cancelled (replayed flag tells whether it was already cancelled)}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/rides/{ride_id}/accept:
    post:
      tags: [staff]
      operationId: acceptRide
      summary: Dispatcher accepts or reassigns after accept_deadline
      security: [{bearerAuth: []}]
      x-course: staff-action
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200': {description: Riding or reassigned}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/rides/{ride_id}/finish:
    post:
      tags: [staff]
      operationId: finishRide
      summary: Dispatcher finishes the ride (night tariff rule)
      security: [{bearerAuth: []}]
      x-course: staff-action
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200': {description: Finished with final fare}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/rides/{ride_id}/payments:
    post:
      tags: [service]
      operationId: startPayment
      summary: Start async payment, returns 202 + Location + Retry-After
      security: [{bearerAuth: []}]
      x-course: long-operation
      parameters:
        - $ref: '#/components/parameters/RideId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentRequest'}
            examples:
              default_fare:
                summary: Сплатити розраховану вартість поїздки
                value: {}
              custom_amount:
                summary: Явна сума в копійках
                value: {amount_minor: 3700, currency: UAH}
      responses:
        '202':
          description: Operation accepted
          headers:
            Location: {schema: {type: string}, example: /v1/operations/7d6f...}
            Retry-After: {schema: {type: integer}, example: 2}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /v1/operations/{operation_id}:
    get:
      tags: [service]
      operationId: getOperation
      summary: Poll my operation (owner only)
      security: [{bearerAuth: []}]
      parameters:
        - name: operation_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Operation state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /v1/drivers:
    get:
      tags: [staff]
      operationId: listDrivers
      summary: Staff view of the driver pool
      security: [{bearerAuth: []}]
      x-course: staff-action
      responses:
        '200': {description: Drivers}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/drivers/{driver_id}/offline:
    post:
      tags: [staff]
      operationId: driverOffline
      summary: Staff takes a driver off the line
      security: [{bearerAuth: []}]
      x-course: staff-action
      parameters:
        - name: driver_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Driver offline}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /v1/drivers/{driver_id}/online:
    post:
      tags: [staff]
      operationId: driverOnline
      summary: Staff returns a driver to the line
      security: [{bearerAuth: []}]
      x-course: staff-action
      parameters:
        - name: driver_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200': {description: Driver online}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/admin/features:
    get:
      tags: [staff]
      operationId: getFeatures
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Feature flags}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/admin/features/{name}:
    post:
      tags: [staff]
      operationId: setFeature
      summary: Flip a feature flag (rollback point for lab 6)
      security: [{bearerAuth: []}]
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [enabled], properties: {enabled: {type: boolean}}}
            examples:
              enable: {value: {enabled: true}}
              rollback: {value: {enabled: false}}
      responses:
        '200': {description: Updated flag}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /v1/me/notifications:
    get:
      tags: [service]
      operationId: listNotifications
      summary: My feed with monotonically growing seq positions
      security: [{bearerAuth: []}]
      parameters:
        - {name: after, in: query, schema: {type: integer, minimum: 0, default: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 50}}
      responses:
        '200':
          description: Notification page with growing seq positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object}}
                  next_cursor: {type: [integer, 'null']}
              examples:
                page: {value: {items: [{seq: 7, id: n-7, type: driver.assigned, payload: {ride_id: 7d6f}}], next_cursor: null}}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /v1/me/notifications/head:
    get:
      tags: [service]
      operationId: notificationHead
      summary: Upper bound for catch-up
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Head position
          content:
            application/json:
              schema: {type: object, properties: {head: {type: integer}}}
              examples:
                head: {value: {head: 12}}
        '401': {$ref: '#/components/responses/Problem'}
  /v1/ws-tickets:
    post:
      tags: [service]
      operationId: createWsTicket
      summary: Single-use WebSocket ticket, 30 s TTL
      security: [{bearerAuth: []}]
      responses:
        '201':
          description: Ticket issued
          content:
            application/json:
              schema: {type: object, properties: {ticket: {type: string}, url: {type: string}, expires_in_s: {type: integer}}}
              examples:
                ticket: {value: {ticket: 7d6f, url: '/v1/ws?ticket=7d6f', expires_in_s: 30}}
        '401': {$ref: '#/components/responses/Problem'}
  /v1/ws:
    get:
      tags: [service]
      operationId: websocket
      summary: WebSocket upgrade through nginx (ticket + Origin are checked)
      description: Client calls /v1/ws?ticket=... over WebSocket; HTTP 101 switches protocol.
      parameters:
        - {name: ticket, in: query, required: true, schema: {type: string}}
      responses:
        '101': {description: Switching Protocols}
        '400': {description: Invalid ticket or Origin; gateway closes the socket with code 1008}
  /sim/charge:
    post:
      tags: [simulator]
      operationId: simCharge
      summary: External payment gateway simulator (2-8 s, 10% 503, 10% decline)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [key, amount_minor], properties: {key: {type: string}, amount_minor: {type: integer}, currency: {type: string}}}
            examples:
              charge: {value: {key: op-id, amount_minor: 3700, currency: UAH}}
      responses:
        '200': {description: Success}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
  /sim/admin/unavailable:
    post:
      tags: [simulator]
      operationId: simUnavailable
      summary: Make the provider return 503 for N seconds (technical failure experiment)
      parameters:
        - {name: seconds, in: query, schema: {type: integer, minimum: 1, maximum: 120, default: 5}}
      responses:
        '200': {description: Mode enabled}
  /sim/effects:
    get:
      tags: [simulator]
      operationId: simEffects
      summary: Effects by provider key (one effect per key)
      responses:
        '200': {description: Recorded effects}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1}
      description: Mandatory for ride and payment creation; 400 if missing.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string}
      description: Current ETag; 428 if missing, 412 if stale.
    RideId:
      name: ride_id
      in: path
      required: true
      schema: {type: string}
  responses:
    Problem:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
          examples:
            no_driver: {value: {type: 'https://example.edu/taxi/problems/no_driver', title: Conflict, status: 409, detail: No free driver in this district, code: no_driver}}
            key_body_mismatch: {value: {type: 'https://example.edu/taxi/problems/key_body_mismatch', title: Unprocessable Entity, status: 422, detail: Idempotency key was used with another body, code: key_body_mismatch}}
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string}
    LoginRequest:
      type: object
      required: [login, password]
      properties: {login: {type: string}, password: {type: string, format: password}}
    User:
      type: object
      properties:
        id: {type: string}
        login: {type: string}
        role: {type: string, enum: [user, staff]}
        district: {type: string}
    LoginResponse:
      type: object
      properties:
        token: {type: string}
        token_type: {type: string}
        expires_at: {type: string, format: date-time}
        user: {$ref: '#/components/schemas/User'}
    RideCreate:
      type: object
      required: [district, pickup]
      properties:
        district: {type: string, minLength: 1}
        pickup: {type: string, minLength: 1}
        tariff: {type: string, enum: [standard, economy, comfort], default: standard}
        distance_km: {type: number, minimum: 0, maximum: 100, default: 2.5}
        duration_min: {type: integer, minimum: 1, maximum: 240, default: 10}
      additionalProperties: true
      description: Unknown fields are ignored so older clients keep working.
    RidePatch:
      type: object
      required: [pickup]
      properties:
        pickup: {type: string, minLength: 1}
    Ride:
      type: object
      properties:
        id: {type: string}
        user_id: {type: string}
        district: {type: string}
        pickup: {type: string}
        driver_id: {type: [string, 'null']}
        status: {type: string, enum: [requested, assigned, riding, finished, cancelled]}
        payment_status: {type: string, enum: [unpaid, pending, paid, failed]}
        fare_minor: {type: integer, format: int64}
        currency: {type: string, example: UAH}
        version: {type: integer}
        tariff: {type: string}
        distance_km: {type: string}
        created_at: {type: string, format: date-time}
        accept_deadline: {type: [string, 'null'], format: date-time}
    PaymentRequest:
      type: object
      properties:
        amount_minor: {type: [integer, 'null'], minimum: 1}
        currency: {type: string, default: UAH}
    Operation:
      type: object
      properties:
        operation_id: {type: string}
        ride_id: {type: string}
        status: {type: string, enum: [pending, running, succeeded, failed]}
        version: {type: integer}
        result: {type: [object, 'null']}
        error: {type: [object, 'null']}
